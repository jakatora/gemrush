# Codemagic CI/CD — GemRush
#
# Stosowany pattern bazuje na wnioskach z realnych buildów (zapisane w
# pamięci Claude'a jako reference_codemagic_flutter_ios.md):
#   - persistent private key (CERTIFICATE_PRIVATE_KEY env var) — unika
#     limitu 1-2 Distribution certów Apple (HTTP 409)
#   - BRAK deklaratywnego `ios_signing:` blocka w environment (jego
#     pre-check pada na "No matching profiles" przed naszymi skryptami)
#   - signing setup w skrypcie via app-store-connect fetch-signing-files
#   - export_options.plist generowany przez xcode-project use-profiles
#     (nie ręcznie)
#   - pinned Flutter version (cached, unika timeoutów CDN)
#   - build_number = $BUILD_NUMBER + 100 (offset bezpieczeństwa)
#
# ─────────────────────────────────────────────────────────────────────────
# SETUP W UI CODEMAGIC (jednorazowo):
#
# 1. Apple Developer Program (99 USD/rok) + App ID `com.gemrush.gemrush`
#    zarejestrowany w developer.apple.com → Identifiers (capabilities:
#    In-App Purchase).
# 2. App Store Connect → My Apps → "+" → wybierz bundle ID
#    `com.gemrush.gemrush`, name "GemRush". Paid Apps Agreement + Bank +
#    W-8BEN podpisane.
# 3. App Store Connect → Users and Access → Integrations →
#    "App Store Connect API" → wygeneruj klucz z rolą **Admin** (Developer
#    nie wystarczy). Pobierz `.p8`, zapisz Key ID + Issuer ID.
# 4. Codemagic → Teams → Integrations → App Store Connect → wgraj klucz.
#    Nazwa: **`codemagic_app_store`** (musi się zgadzać z `integrations:`
#    poniżej).
# 5. Wygeneruj LOKALNIE persistent private key:
#       openssl genrsa -out key.pem 2048
#       base64 -w0 < key.pem > key.b64
#    Codemagic → App settings → Environment variables → dodaj:
#       Name:     CERTIFICATE_PRIVATE_KEY
#       Value:    [zawartość pliku key.b64]
#       Secure:   ✅
#       Group:    ios_signing   (musi być w grupie, nie default)
# 6. Apple Developer Portal: jeśli masz aktywne Distribution certy z
#    poprzednich nieudanych buildów, REVOKE je wszystkie. Codemagic
#    utworzy nowy z naszym persistent key na pierwszym buildzie.
#
# Dla Androida: keystore w Codemagic (Code signing → Android) +
# Google Play service account JSON (opcjonalne, dla auto-publish).
# ─────────────────────────────────────────────────────────────────────────

definitions:
  ios_environment: &ios_environment
    instance_type: mac_mini_m2
    max_build_duration: 90
    working_directory: app
    integrations:
      app_store_connect: codemagic
    environment:
      groups:
        - ios_signing  # zawiera CERTIFICATE_PRIVATE_KEY
      vars:
        BUNDLE_ID: com.gemrush.gemrush
      flutter: 3.38.7
      xcode: latest
      cocoapods: default

  ios_signing_script: &ios_signing_script
    name: Code signing setup (persistent key)
    # WAŻNE: NIE używamy `set -x`. Tracing pokazałby zawartość
    # $CERTIFICATE_PRIVATE_KEY w plaintext w logu (Codemagic nie maskuje
    # nawet "Secure" env vars gdy są echowane).
    script: |
      set -eu

      # Guard 1: zmienna podpięta?
      if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
        echo "❌ CERTIFICATE_PRIVATE_KEY is EMPTY or UNSET."
        echo "Verify in Codemagic UI:"
        echo "  App settings → Environment variables → CERTIFICATE_PRIVATE_KEY"
        echo "  - Value must be the FULL base64 content of key.b64"
        echo "  - Group must be EXACTLY 'ios_signing' (case-sensitive)"
        exit 1
      fi
      echo "✓ CERTIFICATE_PRIVATE_KEY found (length=${#CERTIFICATE_PRIVATE_KEY} chars)"

      keychain initialize

      # Decode robustnie: printf (bez trailing \n), strip ALL whitespace
      # (spacje, taby, LF, CR z Windows line endings) i null bytes, potem
      # `openssl base64 -d -A` (znacznie bardziej tolerancyjne niż macOS
      # coreutils base64 — radzi sobie z dowolnym formattingiem).
      printf '%s' "$CERTIFICATE_PRIVATE_KEY" \
        | tr -d '[:space:]\0' \
        | openssl base64 -d -A > "$HOME/key.pem"
      chmod 600 "$HOME/key.pem"

      # Guard 2: czy zdekodowane jest PEM-em? (NIE pokazujemy zawartości
      # nigdy — tylko boolean check + długość pliku w bajtach.)
      KEY_SIZE=$(wc -c < "$HOME/key.pem" | tr -d ' ')
      echo "✓ Decoded key file size: ${KEY_SIZE} bytes"
      if ! head -1 "$HOME/key.pem" | grep -q "BEGIN"; then
        echo "❌ Decoded file does not start with BEGIN line — invalid PEM."
        echo "Likely cause: CERTIFICATE_PRIVATE_KEY does not contain base64"
        echo "of a PEM key. Regenerate lokalnie:"
        echo "  openssl genrsa -out key.pem 2048"
        echo "  base64 -w0 < key.pem > key.b64"
        echo "Paste key.b64 content into Codemagic env var."
        exit 1
      fi
      echo "✓ key.pem is valid PEM"

      app-store-connect fetch-signing-files "$BUNDLE_ID" \
        --type IOS_APP_STORE \
        --create \
        --certificate-key=@file:"$HOME/key.pem"
      keychain add-certificates
      xcode-project use-profiles \
        --export-options-plist "$CM_BUILD_DIR/export_options.plist"

  ios_privacy_step: &ios_privacy_step
    name: Add PrivacyInfo.xcprivacy do Runner targetu
    script: |
      ruby -e '
        require "xcodeproj"
        project = Xcodeproj::Project.open("ios/Runner.xcodeproj")
        target = project.targets.find { |t| t.name == "Runner" }
        group = project.main_group.find_subpath("Runner", false)
        existing = group.files.find { |f| f.path == "PrivacyInfo.xcprivacy" }
        if existing.nil?
          file_ref = group.new_file("PrivacyInfo.xcprivacy")
          target.add_resources([file_ref])
          project.save
          puts "[privacy] Added PrivacyInfo.xcprivacy to Runner target"
        else
          puts "[privacy] PrivacyInfo already in project"
        end
      '

workflows:

  # ===========================================================
  #  iOS — TestFlight (uruchamiaj na każdym pushu do main)
  # ===========================================================
  ios-testflight:
    name: iOS · TestFlight
    <<: *ios_environment
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Generuj kod (Hive adaptery)
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Generuj launcher icons (skip jeśli brak źródła)
        script: dart run flutter_launcher_icons || echo "skipped"
      - name: Pod install
        script: |
          cd ios && pod install
      - *ios_privacy_step
      - *ios_signing_script
      - name: Flutter analyze
        script: flutter analyze
      - name: Testy jednostkowe
        script: flutter test
      - name: Build IPA
        script: |
          flutter build ipa \
            --release \
            --build-name=1.0.0 \
            --build-number=$(($BUILD_NUMBER + 100)) \
            --export-options-plist="$CM_BUILD_DIR/export_options.plist"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      email:
        recipients:
          - jakatora68@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers

  # ===========================================================
  #  iOS — App Store Release (manual trigger gdy gotowe do recenzji)
  # ===========================================================
  ios-appstore-release:
    name: iOS · App Store Release
    <<: *ios_environment
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Generuj kod (Hive adaptery)
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Generuj launcher icons (skip jeśli brak źródła)
        script: dart run flutter_launcher_icons || echo "skipped"
      - name: Pod install
        script: |
          cd ios && pod install
      - *ios_privacy_step
      - *ios_signing_script
      - name: Flutter analyze
        script: flutter analyze
      - name: Testy jednostkowe
        script: flutter test
      - name: Build IPA
        script: |
          flutter build ipa \
            --release \
            --build-name=1.0.0 \
            --build-number=$(($BUILD_NUMBER + 100)) \
            --export-options-plist="$CM_BUILD_DIR/export_options.plist"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - jakatora68@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false   # zmień na true gdy chcesz auto-submit do recenzji

  # ===========================================================
  #  Android — build AAB do Google Play Internal Testing
  # ===========================================================
  android-internal:
    name: Android · Internal Testing
    instance_type: linux_x2
    max_build_duration: 60
    working_directory: app
    environment:
      android_signing:
        - gemrush_keystore
      vars:
        PACKAGE_NAME: com.gemrush.gemrush
      flutter: 3.38.7
    scripts:
      - name: Flutter pub get
        script: flutter pub get
      - name: Generuj kod (Hive adaptery)
        script: dart run build_runner build --delete-conflicting-outputs
      - name: Generuj launcher icons (skip jeśli brak źródła)
        script: dart run flutter_launcher_icons || echo "skipped"
      - name: Flutter analyze
        script: flutter analyze
      - name: Testy jednostkowe
        script: flutter test
      - name: Build AAB
        script: |
          flutter build appbundle \
            --release \
            --build-name=1.0.0 \
            --build-number=$(($BUILD_NUMBER + 100))
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/**/mapping.txt
    publishing:
      email:
        recipients:
          - jakatora68@gmail.com
        notify:
          success: true
          failure: true
      # google_play:
      #   credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
      #   track: internal
      #   submit_as_draft: true
