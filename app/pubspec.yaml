name: gemrush
description: "GemRush — match-3 puzzle game (Flutter + Flame + AdMob)."
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Game engine
  flame: ^1.18.0
  flame_audio: ^2.10.0

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4

  # Ads — TYMCZASOWO WYŁĄCZONE (crashowało launch na realnym Androidzie).
  # Po podłączeniu Firebase + sprawdzeniu Google Play Services włącz z powrotem:
  #   google_mobile_ads: ^5.1.0
  # Kod AdsService + ConsentService pozostaje jako stub, można podłączyć
  # plugin bez zmian po stronie consumerów (gra/szop).

  # IAP — TYMCZASOWO WYŁĄCZONE (jak google_mobile_ads, oba wymagają
  # Google Play Services, mogą crashować launch).
  # in_app_purchase: ^3.2.0

  # UI
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # Audio
  audioplayers: ^6.1.0

  # Util
  intl: ^0.20.2
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  hive_generator: ^2.0.1
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.4
  image: ^4.5.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/icon_1024.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#170E45"
  adaptive_icon_foreground: "assets/branding/icon_fg.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/gems/
    - assets/images/ui/
    - assets/images/backgrounds/
    - assets/images/obstacles/
    - assets/audio/sfx/
    - assets/audio/music/
    - assets/data/levels/
